name: Build simdutf variant

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    container: almalinux:9
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]

    steps:
      - name: Install dependencies (AlmaLinux)
        run: |
          dnf install -y git make gcc gcc-c++ curl-minimal tar gzip which clang cmake zlib-devel openssl-devel perl-core
          # build.c calls clang-18 by name
          command -v clang-18 || { ln -s /usr/bin/clang /usr/bin/clang-18; ln -s /usr/bin/clang++ /usr/bin/clang++-18; }

      - name: Checkout Source Tree
        uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Build binaries with simdutf
        run: |
          cc -DWITH_SIMDUTF build.c -o build-simdutf
          ./build-simdutf
          ls dist

      - name: Run smoke tests
        run: |
          cd tests
          npm install ws
          node smoke.js

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binaries-simdutf-${{ matrix.os }}
          path: dist/*
          retention-days: 7
